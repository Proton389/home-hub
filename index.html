<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашний хаб</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Хаб">
<meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='2' width='20' height='20' rx='5' fill='%238b6cff'/><circle cx='8' cy='8' r='1.8' fill='white'/><circle cx='12' cy='12' r='1.8' fill='white'/><circle cx='16' cy='16' r='1.8' fill='white'/></svg>">
<style>
:root {
  --bg: #0e1016; --surface: #161922; --surface-2: #1e222d; --border: #282d3a;
  --text: #e9ebf1; --muted: #959cae; --accent: #8b6cff; --accent-soft: rgba(139,108,255,.15);
  --t0: #3ecf8e; --t1: #5aa9ff; --t2: #ff6b6b; --warn: #ffb547; --danger: #ff6b6b;
  --pie-1: #3987e5; --pie-2: #d95926; --pie-3: #199e70; --pie-4: #c98500; --pie-5: #d55181; --pie-other: #52514e;
  --radius: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f9; --surface: #ffffff; --surface-2: #f0f1f6; --border: #e1e3eb;
    --text: #1a1d26; --muted: #687083; --accent: #6a4cf5; --accent-soft: rgba(106,76,245,.1);
    --t0: #12a66a; --t1: #2f7fe0; --t2: #e04848; --warn: #c27a00;
    --pie-1: #2a78d6; --pie-2: #eb6834; --pie-3: #1baf7a; --pie-4: #eda100; --pie-5: #e87ba4; --pie-other: #c3c2b7;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
a { color: inherit; }
.muted { color: var(--muted); }

/* каркас */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 22px; font-weight: 700; font-size: 17px; }
.logo { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), #ff8a5b); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; }
.nav a:hover { color: var(--text); background: var(--surface-2); }
.nav a.active { color: var(--text); background: var(--accent-soft); }
main { padding: 28px clamp(16px, 4vw, 44px) 60px; max-width: 1320px; width: 100%; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; margin-bottom: 22px; }
.head h1 { font-size: 26px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 100%; overflow-x: auto; }
.tabs a { padding: 8px 16px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; }
.tabs a:hover { color: var(--text); }
.tabs a.active { background: var(--accent); color: #fff; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); align-content: start; }
  .sidebar { z-index: 5; height: auto; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
  .brand { padding: 0; }
  .brand span { display: none; }
  .nav { flex-direction: row; overflow-x: auto; }
  main { padding-top: 20px; }
  .tabs { width: 100%; }
  .tabs a { flex: 1; text-align: center; padding: 8px 6px; }
}

/* общие элементы */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-head h2 { font-size: 17px; }
input, select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
input:focus-visible, select:focus-visible, .btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=checkbox] { width: auto; accent-color: var(--accent); }
.btn { font: inherit; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--border); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.icon { padding: 6px; min-width: 32px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; cursor: pointer; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile .v { font-size: 28px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.tile.text .v { font-size: 20px; }
.tile .l { margin-top: 4px; color: var(--muted); font-size: 13px; }
.tile.t0 .v { color: var(--t0); } .tile.t1 .v { color: var(--t1); } .tile.t2 .v { color: var(--t2); }
.add-row { display: flex; flex-wrap: wrap; gap: 10px; }
.add-row input { flex: 1 1 180px; width: auto; }

/* подбор */
.filters { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 160px; }
.field.wide { flex: 2 1 220px; }
.field.fit { flex: 0 1 auto; }
#random { flex: 1 0 auto; height: 42px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.stepper { display: flex; gap: 6px; }
.stepper input { text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); cursor: pointer; }
.chip[aria-pressed=true] { color: var(--c); border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.t0 { --c: var(--t0); } .t1 { --c: var(--t1); } .t2 { --c: var(--t2); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 2px 12px; color: var(--muted); font-size: 14px; }
.meta .spacer { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.game { display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s; }
.game:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); transform: translateY(-2px); }
.game-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.game h3 { font-size: 16px; }
.ext { flex: none; color: var(--muted); padding: 2px; border-radius: 6px; }
.ext:hover { color: var(--accent); }
.facts { display: flex; gap: 16px; color: var(--muted); font-size: 14px; }
.facts span { display: inline-flex; align-items: center; gap: 6px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.game-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); font-size: 14px; }
dialog { padding: 0; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); color: var(--text); width: min(420px, calc(100% - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(3px); }
.dialog-body { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.dialog-body .game { background: var(--surface-2); transform: none; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
.foot-actions { display: flex; gap: 6px; margin-left: auto; }
.game { cursor: pointer; }
.game-title { all: unset; cursor: pointer; overflow-wrap: anywhere; }
.game-title:hover { color: var(--accent); }
.game-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.info-title { font-size: 19px; }
.game-top h3 { flex: 1; min-width: 0; }
.cover-thumb { flex: none; width: 56px; height: 56px; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
.cover { display: block; width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: var(--surface-2); }
.info { margin: 0; display: grid; gap: 12px; }
.info dt { font-size: 12px; font-weight: 700; color: var(--muted); }
.info dd { margin: 2px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
.viewer { width: min(1000px, calc(100% - 16px)); height: calc(100% - 32px); max-height: none; }
.viewer[open] { display: flex; flex-direction: column; }
.viewer-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--border); }
.viewer-head h3 { flex: 1; min-width: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; }

/* статистика */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px; margin-bottom: 16px; }
.chart h2 { font-size: 17px; margin-bottom: 2px; }
.chart-body { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; margin-top: 14px; }
.pie { flex: none; width: 170px; height: 170px; }
.pie path, .pie circle { stroke: var(--surface); stroke-width: 2; stroke-linejoin: round; transition: opacity .15s; }
.legend { flex: 1 1 170px; min-width: 0; margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 42px; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; font-size: 14px; transition: opacity .15s, background .15s; }
.legend li > i { width: 10px; height: 10px; border-radius: 3px; }
.legend li > span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend li > .muted { text-align: right; font-variant-numeric: tabular-nums; }
.legend li.on { background: var(--surface-2); }
.chart .dim { opacity: .3; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.plays-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); column-gap: 28px; margin-top: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
.bar { height: 5px; margin-top: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), #ff8a5b); }
.counter { display: flex; align-items: center; gap: 6px; }
.counter b { min-width: 26px; text-align: center; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 8px; white-space: nowrap; }
td { padding: 6px 4px; border-top: 1px solid var(--border); }
td input { padding: 6px 8px; background: transparent; border-color: transparent; }
td input:hover { border-color: var(--border); }
td input[type=number] { width: 70px; }
td input:not([type=number]) { min-width: 130px; }
.rate { display: flex; align-items: center; gap: 8px; min-width: 100px; font-variant-numeric: tabular-nums; }
.rate i { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.rate i b { display: block; height: 100%; background: var(--t0); }
.actions { display: flex; gap: 4px; justify-content: flex-end; }

/* предзаказы */
.month { margin-top: 22px; }
.month h3 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 4px 8px; }
.pre-list { padding: 6px; }
.pre-row { display: grid; grid-template-columns: minmax(0, 1fr) 170px 150px 36px; gap: 8px; align-items: center; padding: 4px; border-radius: 10px; }
.pre-row + .pre-row { border-top: 1px solid var(--border); border-radius: 0; }
.pre-row input { background: transparent; border-color: transparent; }
.pre-row input:hover { border-color: var(--border); }
.pre-row input.pre-name { font-weight: 600; }
.pre-head { padding: 0 11px; font-size: 12px; font-weight: 700; color: var(--muted); }
.pre-head span { padding-left: 12px; }
.when { font-size: 13px; font-weight: 600; color: var(--muted); }
.when.soon { color: var(--t0); }
.when.late { color: var(--warn); }
@media (max-width: 640px) {
  .pre-row { grid-template-columns: minmax(0, 1fr) 36px; }
  .pre-row .pre-date { grid-column: 1; }
  .pre-row .when { grid-column: 1; padding: 0 12px 6px; }
  .pre-row > .btn { grid-row: 1; grid-column: 2; }
  .pre-head { display: none; }
}

.link-card { display: flex; align-items: center; gap: 14px; text-decoration: none; transition: border-color .15s, transform .15s; }
.link-card:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); transform: translateY(-2px); }
.link-card b { display: block; margin-bottom: 2px; }
.link-card .muted { font-size: 13px; }
.link-icon { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }

.offline { margin: -8px 0 18px; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.place { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.place svg { flex: none; }
.facts .rating { color: var(--text); font-weight: 600; }
.facts .rating svg { color: var(--warn); fill: currentColor; }
.hint { font-size: 12px; font-weight: 400; margin-top: 4px; }
.form-error { color: var(--danger); font-size: 14px; font-weight: 600; }
.form-error:empty { display: none; }
.dialog-body .field { flex: none; }  /* в фильтрах поля тянутся по ширине; в вертикальной форме это давало бы пустоты */
#log-form .chip { --c: var(--accent); }
#log-form .chip[data-w] { --c: var(--warn); }
#log-form .add-row { margin-top: 8px; }
.gf-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.gf-grid > .field { grid-column: 1 / -1; }
.gf-grid > .field.num { grid-column: auto; }
.gf-grid textarea { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; width: 100%; resize: vertical; min-height: 96px; }
.gf-grid textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.gf-types { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.gf-types .check { color: var(--text); font-weight: 400; }
#log-form .add-row input { padding: 7px 10px; }
.chip svg { vertical-align: -2px; }
.ratings { display: grid; gap: 2px; }
.rate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rate-row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stars { display: flex; flex: none; }
.star { font: inherit; font-size: 22px; line-height: 1; padding: 5px 3px; background: none; border: 0; color: var(--border); cursor: pointer; }
.star.on { color: var(--warn); }
.star:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--border); }
.log li:first-child { border-top: 0; }
.log-date { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.log-game { font-weight: 700; }
.log-note { font-size: 14px; margin-top: 2px; }
.winner { display: inline-flex; align-items: center; gap: 3px; color: var(--text); font-weight: 600; }
.winner svg { color: var(--warn); }
#log-more { margin-top: 8px; }
.top { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.top li { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(60px, 1fr) 30px 22px; align-items: center; gap: 10px; font-size: 14px; }
.top li > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.top-bar i { display: block; height: 100%; border-radius: 4px; background: var(--pie-1); }
.top li .muted { text-align: right; font-size: 12px; }
td.pname { font-weight: 600; padding-left: 12px; }
@media (max-width: 520px) {
  .log li { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
  .log-date { grid-column: 1 / -1; padding: 0; }
}

.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: .2s; padding: 10px 16px; border-radius: 10px; font-weight: 600; background: var(--text); color: var(--bg); box-shadow: 0 8px 30px rgba(0,0,0,.3); max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo" id="logo"></div><span>Домашний хаб</span></div>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
  </aside>
  <main>
    <div class="head">
      <div><h1 id="title"></h1><div class="muted" id="subtitle"></div></div>
      <nav class="tabs" id="tabs" aria-label="Вкладки раздела"></nav>
    </div>
    <div class="offline" id="offline" hidden></div>
    <div id="view"><div class="empty">Загрузка…</div></div>
  </main>
</div>
<dialog id="dialog"></dialog>
<dialog id="viewer" class="viewer"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Адрес веб-приложения Apps Script (заканчивается на /exec) — как его получить, написано в README.md.
const API = 'https://script.google.com/macros/s/AKfycbw2fj5R4qPbx6eQ1jQoq0rtN3sbnRUDEmLnlLrDSazVF2KhZX8EnZxORVCDcdZ2oHXe/exec';

// Названия столбцов из Google-таблицы. Переименуете столбцы — поменяйте только здесь.
const COL = { name: 'Название', min: 'Мин игроков', max: 'Макс игроков', time: 'Время', link: 'Ссылка', rules: 'Правила', cover: 'Обложка', place: 'Где искать', desc: 'Описание', types: ['Coop', 'Noncoop', 'Traitor'] };
// Как типы подписаны на сайте (ключи — названия столбцов в таблице).
const TYPE_LABEL = { Coop: 'Кооператив', Noncoop: 'Соревновательная', Traitor: 'С предателем' };
const typeLabel = t => TYPE_LABEL[t] ?? t;
const PLAYS = { name: 'Название', count: 'Партий' };
const PRE = { name: 'Название', date: 'ДД/ММ/ГГГГ' };
const PL = { name: 'Игрок', games: 'Партий', wins: 'Побед' };
const LOG = { id: 'ID', date: 'Дата', game: 'Игра', players: 'Игроки', winners: 'Победители', note: 'Заметка' };  // лист «Журнал»
const RATE = { game: 'Игра', player: 'Игрок', value: 'Оценка' };  // лист «Оценки»

const svg = (p, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
const tile = (v, l, cls = '') => `<div class="card tile ${cls}"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`;

let toastTimer;
function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 2200);
}

const CACHE_KEY = 'hub-data';  // последняя загруженная таблица — чтобы сайт открывался и без связи
async function loadData() {
  const data = await (await fetch(API)).json();
  if (data.error) throw new Error(data.error);
  db = { log: [], ratings: [], ...data };
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), db })); } catch {}
  $('#offline').hidden = true;
}

const PW_KEY = 'hub-password';
const getPw = () => { try { return localStorage.getItem(PW_KEY) || ''; } catch { return ''; } };
const setPw = v => { try { v ? localStorage.setItem(PW_KEY, v) : localStorage.removeItem(PW_KEY); } catch {} };

function askPassword(wrong) {
  return new Promise(resolve => {
    const d = $('#dialog');
    if (d.open) d.close();
    d.innerHTML = `<form class="dialog-body" id="pw-form">
      <h3>Пароль для изменений</h3>
      <div class="muted">${wrong ? 'Пароль не подошёл, попробуйте ещё раз.' : 'Смотреть может любой, а менять данные — только с паролем. Устройство его запомнит.'}</div>
      <input type="password" name="pw" required autocomplete="current-password" aria-label="Пароль">
      <div class="dialog-actions"><button type="button" class="btn ghost" id="pw-cancel">Отмена</button><button class="btn primary">Сохранить</button></div></form>`;
    const f = $('#pw-form');
    f.onsubmit = e => { e.preventDefault(); d.close(); resolve(f.elements.pw.value); };
    $('#pw-cancel').onclick = () => { d.close(); resolve(''); };
    d.oncancel = () => resolve('');  // Esc
    d.onclick = null;
    d.showModal();
  });
}

// Спросить и проверить пароль до того, как открыть форму, чтобы не заполнять её зря. Скрипт всё равно проверяет пароль при сохранении.
async function requirePassword() {
  for (let wrong = false; ;) {
    if (!getPw()) {
      const pw = await askPassword(wrong);
      if (!pw) return false;
      setPw(pw);
    }
    try {
      const res = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ op: 'check', password: getPw() }) })).json();
      if (res.error === 'password') { setPw(''); wrong = true; continue; }
      // старый скрипт не знает команды «check» — значит, в таблице не развёрнута новая версия
      if (res.error === 'неверный запрос') toast('Скрипт в таблице устарел: вставьте новый apps-script.gs и разверните «Новую версию»', true);
      else if (res.error) toast('Не получилось: ' + res.error, true);
      return !res.error;
    } catch {
      toast('Нет связи с Google-таблицей', true);
      return false;
    }
  }
}

// shortcut: игроки и предзаказы сохраняются листом целиком, последняя запись побеждает; если два устройства правят один лист в одну секунду, одна правка потеряется. Станет мешать — перейти на команды по строкам, как с партиями.
// сохранения идут строго по очереди: иначе при быстрых кликах старый запрос может дойти позже нового и затереть его
let saveQueue = Promise.resolve(), pending = 0;
const save = (key, msg) => send(() => ({ key, rows: db[key] }), msg);
function send(body, msg) {  // body() собирает запрос в момент отправки, чтобы ушли самые свежие данные
  pending++;
  return saveQueue = saveQueue.then(() => sendSave(body, msg)).finally(() => pending--);
}
async function sendSave(body, msg = 'Сохранено') {
  let wrong = false;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (!getPw()) {
      const pw = await askPassword(wrong);
      if (!pw) { toast('Не сохранено: нужен пароль', true); return false; }
      setPw(pw);
    }
    try {
      // text/plain — чтобы браузер не слал предварительный запрос, который Apps Script не умеет принимать
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body(), password: getPw() }) });
      const res = await r.json();
      if (res.error === 'password') { setPw(''); wrong = true; continue; }
      if (res.error) throw new Error(res.error);
      toast(msg);
      return res;
    } catch (e) {
      toast(e instanceof TypeError ? 'Не сохранилось: нет связи с Google-таблицей' : 'Не сохранилось: ' + e.message, true);
      return false;
    }
  }
  toast('Не сохранено: неверный пароль', true);
  return false;
}

function route() {
  const [, b, t] = location.hash.split('/');
  branch = BRANCHES.find(x => x.id === b) || BRANCHES[0];
  tab = branch.tabs.find(x => x.id === t) || branch.tabs[0];
  $('#nav').innerHTML = BRANCHES.map(x => `<a href="#/${x.id}" class="${x === branch ? 'active' : ''}" ${x === branch ? 'aria-current="page"' : ''}>${x.icon}<span>${esc(x.title)}</span></a>`).join('');
  $('#tabs').innerHTML = branch.tabs.map(x => `<a href="#/${branch.id}/${x.id}" class="${x === tab ? 'active' : ''}" ${x === tab ? 'aria-current="page"' : ''}>${esc(x.title)}</a>`).join('');
  document.title = `${tab.title} · ${branch.title}`;
  render();
}

/* ---------- Журнал партий и оценки ---------- */

const splitNames = s => String(s ?? '').split(',').map(x => x.trim()).filter(Boolean);
const fmtDate = d => d ? `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}` : '';

// Всё считается из журнала: партии игр, партии и победы игроков, когда играли последний раз. Оценки — средние по игрокам.
let S = { games: new Map(), players: new Map() }, R = new Map();
function computeStats() {
  const games = new Map(), players = new Map();
  const player = n => players.get(norm(n)) ?? players.set(norm(n), { name: n, plays: 0, wins: 0 }).get(norm(n));
  for (const e of db.log) {
    const k = norm(e[LOG.game]), d = parseDate(e[LOG.date]);
    const g = games.get(k) ?? games.set(k, { name: String(e[LOG.game]).trim(), n: 0, last: null }).get(k);
    g.n++;
    if (d && (!g.last || d > g.last)) g.last = d;
    splitNames(e[LOG.players]).forEach(n => player(n).plays++);
    splitNames(e[LOG.winners]).forEach(n => player(n).wins++);
  }
  for (const p of db.players) if (String(p[PL.name] ?? '').trim()) player(String(p[PL.name]).trim());  // игроки без партий тоже в списке
  S = { games, players };
  R = new Map();
  for (const r of db.ratings) {
    const v = num(r[RATE.value]);
    if (!v) continue;
    const k = norm(r[RATE.game]), g = R.get(k) ?? R.set(k, { sum: 0, count: 0, by: new Map() }).get(k);
    g.sum += v; g.count++; g.by.set(norm(r[RATE.player]), v);
  }
}
const playsOf = name => S.games.get(norm(name))?.n ?? 0;
const lastPlayed = name => S.games.get(norm(name))?.last ?? null;
const ratingOf = name => { const r = R.get(norm(name)); return r ? { avg: r.sum / r.count, count: r.count, by: r.by } : null; };
const allPlayers = () => [...S.players.values()].sort((a, b) => byName(a.name, b.name));

function playsList() {  // все игры коллекции + игры из журнала, которых уже нет на Лист1
  const known = new Set(db.games.map(g => norm(g[COL.name])));
  const list = db.games.map(g => ({ name: g[COL.name], n: playsOf(g[COL.name]) }));
  for (const [k, g] of S.games) if (!known.has(k)) list.push({ name: g.name, n: g.n });
  return list;
}

function showLogForm(gameName = '') {
  const d = $('#dialog'), sel = new Set(), win = new Set();

    <label class="field"><span>Игра</span><input name="game" list="log-games" autocomplete="off" placeholder="Начните вводить название" value="${esc(game ? String(game[COL.name]).trim() : '')}"></label>
    <datalist id="log-games">${db.games.map(g => `<option value="${esc(String(g[COL.name]).trim())}">`).join('')}</datalist>
    <label class="field"><span>Дата</span><input name="date" type="date" value="${toISO(new Date())}"></label>
    <div class="field"><span>Кто играл</span><div class="chips" id="lf-players"></div>
      <div class="add-row"><input id="lf-new" placeholder="Новый игрок" aria-label="Имя нового игрока"><button type="button" class="btn sm" id="lf-add">Добавить</button></div></div>
    <div class="field"><span>Победители</span><div class="chips" id="lf-winners"></div><div class="muted hint">Никого не отметили — значит, победила игра.</div></div>
    <label class="field"><span>Заметка</span><input name="note" maxlength="300" placeholder="Необязательно"></label>
    <div class="form-error" id="lf-error" role="alert"></div>
    <div class="dialog-actions"><button type="button" class="btn ghost" id="lf-cancel">Отмена</button><button class="btn primary">Записать</button></div>
  </form>`;
  const f = $('#log-form'), err = msg => { $('#lf-error').textContent = msg; };
  const chips = () => {
    $('#lf-players').innerHTML = names.map(n => `<button type="button" class="chip" data-p="${esc(n)}" aria-pressed="${sel.has(n)}">${esc(n)}</button>`).join('') || '<span class="muted">Добавьте игроков ниже</span>';
    $('#lf-winners').innerHTML = [...sel].map(n => `<button type="button" class="chip" data-w="${esc(n)}" aria-pressed="${win.has(n)}">${ICON.trophy} ${esc(n)}</button>`).join('') || '<span class="muted">Сначала отметьте, кто играл</span>';
  };
  chips();
  f.onclick = e => {
    const p = e.target.closest('[data-p]')?.dataset.p, w = e.target.closest('[data-w]')?.dataset.w;
    if (p != null) { if (sel.has(p)) { sel.delete(p); win.delete(p); } else sel.add(p); chips(); }
    if (w != null) { win.has(w) ? win.delete(w) : win.add(w); chips(); }
  };
  $('#lf-add').onclick = () => {
    const n = $('#lf-new').value.trim();
    if (!n || n.includes(',')) return err(n ? 'В имени не должно быть запятой' : 'Введите имя игрока');
    const same = names.find(x => norm(x) === norm(n));
    if (!same) names.push(n);
    sel.add(same ?? n);
    $('#lf-new').value = '';
    err('');
    chips();
  };
  $('#lf-new').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#lf-add').click(); } };
  f.onsubmit = e => {
    e.preventDefault();
    const g = db.games.find(x => norm(x[COL.name]) === norm(f.elements.game.value));
    if (!g) return err(f.elements.game.value.trim() ? 'Такой игры нет в коллекции — выберите из списка' : 'Выберите игру');
    if (!parseDate(f.elements.date.value)) return err('Укажите дату');
    if (!sel.size) return err('Отметьте, кто играл');
    d.close();
    recordPlay(String(g[COL.name]).trim(), fromISO(f.elements.date.value), [...sel], [...win], f.elements.note.value.trim());
  };
  $('#close').onclick = $('#lf-cancel').onclick = () => d.close();
  d.onclick = e => { if (e.target === d) d.close(); };
  if (!d.open) d.showModal();
}

async function recordPlay(game, date, players, winners, note) {
  const entry = { [LOG.id]: '', [LOG.date]: date, [LOG.game]: game, [LOG.players]: players.join(', '), [LOG.winners]: winners.join(', '), [LOG.note]: note };
  db.log.push(entry);
  for (const n of players) if (!db.players.some(p => norm(p[PL.name]) === norm(n))) db.players.push({ [PL.name]: n, [PL.games]: 0, [PL.wins]: 0 });
  render();
  const res = await send(() => ({ op: 'log', date, game, players, winners, note }), `Записано: ${game}`);
  if (res) entry[LOG.id] = res.id;
  else { db.log.splice(db.log.indexOf(entry), 1); render(); }  // не сохранилось — не показываем то, чего нет в таблице
}

async function deletePlay(entry) {
  if (!entry || !confirm(`Удалить запись «${entry[LOG.game]}» от ${entry[LOG.date]}?`)) return;
  const i = db.log.indexOf(entry);
  db.log.splice(i, 1);
  render();
  if (!await send(() => ({ op: 'unlog', id: entry[LOG.id] }), 'Запись удалена')) { db.log.splice(i, 0, entry); render(); }
}

let openGame = null;  // игра, открытая в окне «Подробнее», — чтобы перерисовать звёзды после оценки
async function rate(game, player, value) {
  let row = db.ratings.find(r => norm(r[RATE.game]) === norm(game) && norm(r[RATE.player]) === norm(player));
  const before = row ? row[RATE.value] : null;
  if (row) row[RATE.value] = value; else db.ratings.push(row = { [RATE.game]: game, [RATE.player]: player, [RATE.value]: value });
  const redraw = () => { render(); if ($('#dialog').open && openGame) showGame(openGame); };
  redraw();
  if (!await send(() => ({ op: 'rate', game, player, value }), value ? `${player}: ${value} из 5` : 'Оценка снята')) {
    if (before == null) db.ratings.splice(db.ratings.indexOf(row), 1); else row[RATE.value] = before;
    redraw();
  }
}

// Поля формы — заголовки листа игр, кроме «Партий» (его считает журнал)
const gameColumns = () => (db.gameColumns?.length ? db.gameColumns : Object.keys(db.games[0] ?? { [COL.name]: '' })).filter(h => h !== PLAYS.count);

async function showGameForm(g = null) {
  if (!await requirePassword()) return;
  const d = $('#dialog'), cols = gameColumns(), numeric = [COL.min, COL.max, COL.time], urls = [COL.link, COL.rules, COL.cover];
  const val = h => g ? String(g[h] ?? '') : '';
  const input = h => {
    const label = `<span>${esc(h)}${h === COL.name ? ' *' : ''}</span>`, v = esc(val(h));
    if (h === COL.desc) return `<label class="field">${label}<textarea data-col="${esc(h)}" rows="4">${v}</textarea></label>`;
    if (numeric.includes(h)) return `<label class="field num">${label}<input type="number" min="0" inputmode="numeric" data-col="${esc(h)}" value="${v}"></label>`;
    return `<label class="field">${label}<input ${urls.includes(h) ? 'inputmode="url" placeholder="https://…"' : ''} data-col="${esc(h)}" value="${v}" ${h === COL.name ? 'required' : ''}></label>`;
  };
  const types = cols.filter(h => COL.types.includes(h));
  d.innerHTML = `<form class="dialog-body" id="game-form" novalidate>
    <div class="game-top"><h3 class="info-title">${g ? 'Изменить игру' : 'Новая игра'}</h3><button type="button" class="btn icon ghost" id="close" aria-label="Закрыть">✕</button></div>
    <div class="gf-grid">${cols.filter(h => !COL.types.includes(h)).map(input).join('')}</div>
    ${types.length ? `<div class="field"><span>Тип</span><div class="gf-types">${types.map(h => `<label class="check"><input type="checkbox" data-col="${esc(h)}" ${num(val(h)) === 1 ? 'checked' : ''}> ${esc(typeLabel(h))}</label>`).join('')}</div></div>` : ''}
    <div class="muted hint">* — обязательное поле, остальные можно заполнить позже.</div>
    <div class="form-error" id="gf-error" role="alert"></div>
    <div class="dialog-actions"><button type="button" class="btn ghost" id="gf-cancel">Отмена</button><button class="btn primary">${g ? 'Сохранить' : 'Добавить игру'}</button></div>
  </form>`;
  const f = $('#game-form'), err = msg => { $('#gf-error').textContent = msg; };
  f.onsubmit = e => {
    e.preventDefault();
    const fields = {};
    f.querySelectorAll('[data-col]').forEach(el => { fields[el.dataset.col] = el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value.trim(); });
    const name = fields[COL.name];
    if (!name) return err('Укажите название');
    if (db.games.some(x => x !== g && norm(x[COL.name]) === norm(name))) return err('Такая игра уже есть в коллекции');
    if (fields[COL.min] && fields[COL.max] && num(fields[COL.min]) > num(fields[COL.max])) return err(`«${COL.min}» больше, чем «${COL.max}»`);
    d.close();
    saveGame(g, fields);
  };
  $('#close').onclick = $('#gf-cancel').onclick = () => d.close();
  d.onclick = e => { if (e.target === d) d.close(); };
  if (!d.open) d.showModal();
  f.querySelector('[data-col]').focus();
}

function renameLocal(from, to) {  // журнал и оценки хранят название игры текстом — переименовываем и их
  for (const e of db.log) if (norm(e[LOG.game]) === norm(from)) e[LOG.game] = to;
  for (const r of db.ratings) if (norm(r[RATE.game]) === norm(from)) r[RATE.game] = to;
}

async function saveGame(g, fields) {
  const isNew = !g, original = isNew ? null : String(g[COL.name]), before = isNew ? null : { ...g };
  if (isNew) db.games.push(g = { ...Object.fromEntries(gameColumns().map(h => [h, ''])), [PLAYS.count]: '0', ...fields });
  else Object.assign(g, fields);
  const renamed = !isNew && norm(original) !== norm(fields[COL.name]);
  if (renamed) renameLocal(original, fields[COL.name]);
  render();
  const res = await send(() => ({ op: 'saveGame', original, fields }), isNew ? `Добавлено: ${fields[COL.name]}` : 'Изменения сохранены');
  if (res) return;
  if (isNew) db.games.splice(db.games.indexOf(g), 1);  // не сохранилось — возвращаем как было
  else { Object.assign(g, before); if (renamed) renameLocal(fields[COL.name], original); }
  render();
}

function favourites() {  // игрок → игра с его самой высокой оценкой
  const best = new Map();
  for (const r of db.ratings) {
    const v = num(r[RATE.value]), k = norm(r[RATE.player]);
    if (v && v > (best.get(k)?.v ?? 0)) best.set(k, { v, game: String(r[RATE.game]).trim() });
  }
  return best;
}

document.addEventListener('click', e => {

/* ---------- Подбор ---------- */

const F = { q: '', players: '', time: '', types: [], sort: 'name' };
const SORTS = {
  name: ['По названию', (a, b) => byName(a[COL.name], b[COL.name])],
  short: ['Сначала короткие', (a, b) => num(a[COL.time]) - num(b[COL.time])],
  rare: ['Реже всего играли', (a, b) => playsOf(a[COL.name]) - playsOf(b[COL.name])],
  often: ['Чаще всего играли', (a, b) => playsOf(b[COL.name]) - playsOf(a[COL.name])],
  rating: ['Лучшие по оценке', (a, b) => (ratingOf(b[COL.name])?.avg ?? -1) - (ratingOf(a[COL.name])?.avg ?? -1) || byName(a[COL.name], b[COL.name])],
  stale: ['Давно не играли', (a, b) => (lastPlayed(a[COL.name]) ?? 0) - (lastPlayed(b[COL.name]) ?? 0) || byName(a[COL.name], b[COL.name])],
};

function filtered() {
  const q = norm(F.q), n = num(F.players), t = num(F.time);
  return db.games.filter(g =>
    (!q || norm(g[COL.name]).includes(q) || norm(g[COL.place]).includes(q)) &&
    (!n || (num(g[COL.min]) <= n && n <= num(g[COL.max]))) &&
    (!t || num(g[COL.time]) <= t) &&
    (!F.types.length || F.types.some(k => num(g[k]) === 1))
  ).sort(SORTS[F.sort][1]);
}

// Обложка из столбца COL.cover: ссылка на файл Google Диска (превращается в картинку) или прямая ссылка на изображение.
function coverImg(g, size, cls, alt) {
  const url = String(g[COL.cover] ?? '').trim(), id = driveId(url);
  const src = id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${size}` : /^https?:\/\//i.test(url) ? url : '';
  return src ? `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
}

function gameFacts(g) {
  const players = num(g[COL.min]) === num(g[COL.max]) ? g[COL.min] : `${g[COL.min]}–${g[COL.max]}`;
  const r = ratingOf(g[COL.name]), place = String(g[COL.place] ?? '').trim();
  return `<div class="facts"><span title="${esc(COL.min)} / ${esc(COL.max)}">${ICON.users}${esc(players)}</span><span title="${esc(COL.time)}">${ICON.clock}${esc(g[COL.time])} мин</span>${r ? `<span class="rating" title="Средняя оценка ${r.avg.toFixed(1)} из 5, оценок: ${r.count}">${ICON.star}${r.avg.toFixed(1)}</span>` : ''}</div>
    ${place ? `<div class="place" title="${esc(COL.place)}">${ICON.pin}${esc(place)}</div>` : ''}
    <div class="badges">${COL.types.map((t, i) => num(g[t]) === 1 ? `<span class="badge t${i}">${esc(typeLabel(t))}</span>` : '').join('')}</div>`;
}

function gameCard(g) {
  const name = g[COL.name], link = String(g[COL.link] ?? '');
  return `<article class="card game" data-gi="${db.games.indexOf(g)}">
    <div class="game-top">${coverImg(g, 200, 'cover-thumb', '')}<h3><button class="game-title" title="Подробнее">${esc(name)}</button></h3>${/^https?:\/\//i.test(link) ? `<a class="ext" href="${esc(link)}" target="_blank" rel="noopener" title="Страница игры" aria-label="Страница игры ${esc(name)}">${ICON.ext}</a>` : ''}</div>
    ${gameFacts(g)}
    <div class="game-foot"><span class="muted">Партий: <b>${playsOf(name)}</b></span><span class="foot-actions">${rulesLink(g)}<button class="btn sm" data-play="${esc(name)}">+ партия</button></span></div>
  </article>`;
}

// Окно «Подробнее». Столбцы Лист1, которых нет на карточке (описание и т. п.), появляются здесь сами.
function showGame(g) {
  openGame = g;
  const name = String(g[COL.name]).trim(), link = String(g[COL.link] ?? ''), r = ratingOf(name), last = lastPlayed(name);
  const onCard = new Set([COL.name, COL.min, COL.max, COL.time, COL.link, COL.rules, COL.cover, COL.place, PLAYS.count, ...COL.types]);
  const extra = Object.entries(g).filter(([k, v]) => !onCard.has(k) && String(v ?? '').trim());
  const ratingRows = allPlayers().map(p => {
    const v = r?.by.get(norm(p.name)) ?? 0;
    return `<div class="rate-row"><span>${esc(p.name)}</span><span class="stars" role="group" aria-label="Оценка: ${esc(p.name)}">${[1, 2, 3, 4, 5].map(st =>
      `<button type="button" class="star ${st <= v ? 'on' : ''}" data-rate="${st}" data-player="${esc(p.name)}" aria-label="${st} из 5" aria-pressed="${st === v}">★</button>`).join('')}</span></div>`;
  }).join('');
  const d = $('#dialog');
  d.innerHTML = `<div class="dialog-body">
    <div class="game-top"><h3 class="info-title">${esc(name)}</h3><button class="btn icon ghost" id="close" aria-label="Закрыть">✕</button></div>
    ${coverImg(g, 800, 'cover', `Обложка: ${name}`)}
    ${gameFacts(g)}
    ${extra.length ? `<dl class="info">${extra.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : '<div class="muted">Описание пока не добавлено.</div>'}
    <div class="field"><span>Оценки${r ? ` · средняя ${r.avg.toFixed(1)} из 5` : ''}</span>
      <div class="ratings">${ratingRows || '<span class="muted">Сначала добавьте игроков во вкладке «Статистика»</span>'}</div>
      ${ratingRows ? '<div class="muted hint">Нажмите ту же звезду ещё раз, чтобы снять оценку.</div>' : ''}</div>
    <div class="game-foot"><span class="muted">Партий: <b>${playsOf(name)}</b>${last ? ` · последний раз ${fmtDate(last)}` : ''}</span><span class="foot-actions">${rulesLink(g)}${/^https?:\/\//i.test(link) ? `<a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">${ICON.ext} Страница игры</a>` : ''}<button class="btn sm" id="edit-game">${ICON.edit} Изменить</button><button class="btn sm" data-play="${esc(name)}">+ партия</button></span></div>
  </div>`;

  $('#edit-game').onclick = () => showGameForm(g);

    if (!b) return;

    rate(name, b.dataset.player, v === cur ? 0 : v);

}

document.addEventListener('click', e => {
  const card = e.target.closest('.game[data-gi]');
  if (!card || (e.target.closest('a, button') && !e.target.closest('.game-title'))) return;  // кнопки и ссылки карточки работают как раньше

// Правила: ссылка из столбца COL.rules. Файл с Google Диска открывается в окне сайта, остальные ссылки — в новой вкладке.
const driveId = url => String(url).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{10,})/)?.[1];
function rulesLink(g) {
  const url = String(g[COL.rules] ?? '').trim();
  return /^https?:\/\//i.test(url) ? `<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener" data-rules="${esc(g[COL.name])}">${ICON.book} Правила</a>` : '';
}
function showRules(name, url) {
  const v = $('#viewer');
  v.innerHTML = `<div class="viewer-head"><h3>${esc(String(name).trim())} — правила</h3>
    <a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">${ICON.ext} В новой вкладке</a>

// Круговая диаграмма: не больше 6 долей, хвост сворачивается в «Остальные». Цвета — слоты палитры по порядку долей.
function pieCard(title, items, unit) {
  const sorted = items.filter(x => x.value > 0).sort((a, b) => b.value - a.value || byName(a.name, b.name));
  const total = sorted.reduce((s, x) => s + x.value, 0);
  const head = `<h2>${esc(title)}</h2><div class="muted">всего ${total} ${unit(total)}</div>`;
  if (!total) return `<section class="card chart">${head}<div class="empty">Пока нет данных</div></section>`;
  const parts = sorted.length > 6 ? [...sorted.slice(0, 5), { name: 'Остальные', value: sorted.slice(5).reduce((s, x) => s + x.value, 0), other: true }] : sorted;
  const pct = v => Math.round(v / total * 100) + '%';
  let angle = -Math.PI / 2;
  const marks = parts.map((p, i) => {
    const color = p.other ? 'var(--pie-other)' : `var(--pie-${i + 1})`;
    const tip = `<title>${esc(`${p.name}: ${p.value} ${unit(p.value)} (${pct(p.value)})`)}</title>`;
    if (parts.length === 1) return `<circle cx="90" cy="90" r="86" fill="${color}" data-i="${i}">${tip}</circle>`;
    const a0 = angle, a1 = angle += p.value / total * 2 * Math.PI;
    const [x0, y0, x1, y1] = [Math.cos(a0), Math.sin(a0), Math.cos(a1), Math.sin(a1)].map(v => (90 + 86 * v).toFixed(2));
    return `<path d="M90 90L${x0} ${y0}A86 86 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}Z" fill="${color}" data-i="${i}">${tip}</path>`;
  });
  const legend = parts.map((p, i) => `<li data-i="${i}"><i style="background:${p.other ? 'var(--pie-other)' : `var(--pie-${i + 1})`}"></i><span title="${esc(p.name)}">${esc(p.name)}</span><b>${p.value}</b><span class="muted">${pct(p.value)}</span></li>`);
  return `<section class="card chart">${head}
    <div class="chart-body"><svg class="pie" viewBox="0 0 180 180" role="img" aria-label="${esc(title)}: ${esc(parts.map(p => `${p.name} ${pct(p.value)}`).join(', '))}">${marks.join('')}</svg>
    <ul class="legend">${legend.join('')}</ul></div></section>`;
}

function renderPlayers() {
  const box = $('#players'), fav = favourites();
  const rows = allPlayers().sort((a, b) => b.wins - a.wins || b.plays - a.plays || byName(a.name, b.name));
  box.innerHTML = rows.length ? `<div class="table-wrap"><table>
    <thead><tr><th>${esc(PL.name)}</th><th>${esc(PL.games)}</th><th>${esc(PL.wins)}</th><th>% побед</th><th>Любимая игра</th><th></th></tr></thead>
    <tbody>${rows.map(p => {
      const rate = p.plays ? Math.round(p.wins / p.plays * 100) : null, i = db.players.findIndex(x => norm(x[PL.name]) === norm(p.name));
      const del = p.plays || i < 0 ? 'disabled title="У игрока есть партии в журнале — удалить нельзя"' : `data-del="${i}" title="Удалить игрока"`;
      return `<tr><td class="pname">${esc(p.name)}</td><td>${p.plays}</td><td>${p.wins}</td>
        <td><div class="rate"><i><b style="width:${rate ?? 0}%"></b></i>${rate == null ? '—' : rate + '%'}</div></td>
        <td class="muted">${esc(fav.get(norm(p.name))?.game ?? '—')}</td>
        <td><div class="actions"><button class="btn icon ghost sm" ${del} aria-label="Удалить игрока">${ICON.trash}</button></div></td></tr>`;
    }).join('')}</tbody></table></div>` : '<div class="empty">Игроков пока нет</div>';
  box.onclick = e => {
    const b = e.target.closest('[data-del]'), p = b && db.players[b.dataset.del];
    if (!p || !confirm(`Удалить игрока «${String(p[PL.name]).trim()}»?`)) return;
    db.players.splice(b.dataset.del, 1);
    save('players', 'Игрок удалён');
    render();
  };
}

/* ---------- Предзаказы ---------- */

const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const pad = n => String(n).padStart(2, '0');
function parseDate(s) {  // "01.12.2026", "01/12/2026" или "2026-12-01" → Date
  const t = String(s ?? '').trim(), iso = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  const m = iso ? [t, iso[3], iso[2], iso[1]] : t.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);
  if (!m) return null;
  const d = new Date(+m[3], m[2] - 1, +m[1]);
  return d.getMonth() === m[2] - 1 ? d : null;  // отсекает несуществующие даты вроде 31.02
}
const toISO = d => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : '';
const fromISO = s => { const [y, m, d] = String(s).split('-'); return y && m && d ? `${d}.${m}.${y}` : ''; };

function until(d) {
  if (!d) return ['дата не указана', ''];
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const days = Math.round((d - t) / 864e5);
  if (days < 0) return ['срок прошёл — пришёл?', 'late'];
  if (days === 0) return ['сегодня', 'soon'];
  if (days <= 60) return [`через ${days} ${plural(days, 'день', 'дня', 'дней')}`, days <= 14 ? 'soon' : ''];
  const m = Math.round(days / 30.44);
  return [`через ${m} ${plural(m, 'месяц', 'месяца', 'месяцев')}`, ''];
}

function renderPreorders(el) {
  const items = db.preorders.map((p, i) => ({ p, i, d: parseDate(p[PRE.date]) }))
    .sort((a, b) => (a.d ?? 9e15) - (b.d ?? 9e15) || byName(a.p[PRE.name], b.p[PRE.name]));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const next = items.find(x => x.d && x.d >= today);
  const groups = [];
  for (const x of items) {
    const label = x.d ? `${MONTHS[x.d.getMonth()]} ${x.d.getFullYear()}` : 'Без даты';
    if (groups.at(-1)?.label !== label) groups.push({ label, items: [] });
    groups.at(-1).items.push(x);
  }

  el.innerHTML = `
    <div class="tiles">
      ${tile(items.length, plural(items.length, 'предзаказ', 'предзаказа', 'предзаказов'))}
      ${next ? tile(next.p[PRE.name], `ближайший — ${until(next.d)[0]}`, 'text') : ''}
      ${tile(items.filter(x => x.d && x.d.getFullYear() === today.getFullYear()).length, `придёт в ${today.getFullYear()} году`)}
    </div>
    <form class="card add-row" id="add-pre">
      <input name="game" placeholder="Название игры" required aria-label="Название игры">
      <input name="date" type="date" aria-label="Дата прихода" style="flex:0 1 190px">
      <button class="btn primary">Добавить предзаказ</button>
    </form>
    ${items.length ? `<div class="pre-row pre-head" style="margin-top:18px"><span>${esc(PRE.name)}</span><span>${esc(PRE.date)}</span><span></span><span></span></div>` : '<div class="empty">Предзаказов нет</div>'}
    <div id="pre-list">${groups.map(g => `<section class="month"><h3>${g.label} · ${g.items.length}</h3><div class="card pre-list">
      ${g.items.map(({ p, i, d }) => {
        const [text, cls] = until(d);
        return `<div class="pre-row">
          <input class="pre-name" data-i="${i}" value="${esc(p[PRE.name])}" aria-label="Название">
          <input class="pre-date" type="date" data-i="${i}" value="${toISO(d)}" aria-label="Дата прихода">
          <span class="when ${cls}">${text}</span>
          <button class="btn icon ghost" data-del="${i}" title="Удалить предзаказ" aria-label="Удалить предзаказ">${ICON.trash}</button>
        </div>`;
      }).join('')}</div></section>`).join('')}</div>`;

  $('#add-pre').onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    db.preorders.push({ [PRE.name]: f.elements.game.value.trim(), [PRE.date]: fromISO(f.elements.date.value) });
    save('preorders', 'Предзаказ добавлен');
    render();
  };
  const list = $('#pre-list');
  let regroup = false;
  list.onchange = e => {
    const t = e.target, p = db.preorders[t.dataset.i];
    if (!p) return;
    if (t.type === 'date') {
      p[PRE.date] = fromISO(t.value);
      const [text, cls] = until(parseDate(p[PRE.date]));
      t.nextElementSibling.textContent = text;
      t.nextElementSibling.className = 'when ' + cls;
      regroup = true;
    } else p[PRE.name] = t.value;
    save('preorders');
  };
  // пересортировать по месяцам, только когда фокус ушёл из списка, иначе ввод даты сбивается
  list.onfocusout = e => { if (regroup && !list.contains(e.relatedTarget)) render(); };
  list.onclick = e => {
    const b = e.target.closest('[data-del]'), p = b && db.preorders[b.dataset.del];
    if (!p || !confirm(`Удалить предзаказ «${p[PRE.name]}»?`)) return;
    db.preorders.splice(b.dataset.del, 1);
    save('preorders', 'Предзаказ удалён');
    render();
  };
}

/* ---------- Запуск ---------- */

$('#logo').innerHTML = ICON.dice;
window.addEventListener('hashchange', route);
// другое устройство могло что-то поменять, пока вкладка была в фоне
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || pending || $('#dialog').open || document.activeElement?.matches('input')) return;
  try { await loadData(); render(); } catch {}
});
if (!API) $('#view').innerHTML = '<div class="empty">Сайт ещё не подключён к Google-таблице: впишите адрес Apps Script в строку <code>const API</code> в index.html (см. README.md).</div>';
else loadData().then(route, e => {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch {}
  if (cached?.db) {  // нет связи — показываем последнюю загруженную копию
    db = cached.db;
    const at = new Date(cached.at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    $('#offline').textContent = `Нет связи с таблицей — показаны данные от ${at}. Изменения сейчас не сохранятся.`;
    $('#offline').hidden = false;
    return route();
  }
  $('#view').innerHTML = `<div class="empty">Не удалось загрузить данные из Google-таблицы${e instanceof TypeError ? ' — есть ли интернет?' : ': ' + esc(e.message)}</div>`;
});
// иконка на экране телефона и запуск без сети (sw.js); работает только по https или на localhost
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
